# Hermes Chat Lite —— nginx 配置（模板）
#
# 由 nginx 官方镜像的入口脚本做 envsubst 后写入 /etc/nginx/conf.d/default.conf。
# ⚠️ 它只替换【环境变量里存在】的名字（HERMES_API_SERVER_KEY），
#    nginx 自己的 $host / $uri / $remote_addr 不在环境里，不会被吃掉。
#    千万不要手工 `envsubst < nginx.conf`（会把 $host 也替换成空）。

# ★★ 上游一律走【变量 + resolver】做动态解析，不再用 `upstream { server hermes:8642; }`
#    （2026-11-10 事故：`upstream`/`proxy_pass http://名字` 的静态域名**只在 nginx 启动那一刻解析一次**，
#     之后永不重查。2026-11-09 16:40 `docker restart hermes` 换了内网 IP，chatlite 没跟着重启，
#     于是所有 /api、/v1 全 502（静态页和 inbox 侧车正常），网页能开却聊不了 —— 只有重启 chatlite 才好。）
#    现在：resolver 指 Docker 内嵌 DNS（user-defined 网络上恒为 127.0.0.11），valid=10s 允许短缓存，
#    proxy_pass 里用变量 ⇒ 每次建连前重新解析，容器换 IP 后最多 10 秒自己跟上，不必人工重启。
#    ⚠️ 代价：一旦 proxy_pass 带变量，nginx 就**不再使用 upstream 连接池**（keepalive 失效，每请求新建连接）。
#       本项目是自用低频站点，可接受；将来真需要连接池，得换 nginx Plus 的 `server … resolve`。
#    ⚠️ 变量名必须小写且不与任何环境变量重名 —— 镜像入口脚本会对本模板跑 envsubst（只替换"环境里存在"的名字），
#       `$hermes_api` 这类自定义变量不能被它吃掉。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 三个上游：API server / dashboard（只在 /api/model-info 用）/ inbox 侧车
    set $hermes_api       "hermes:8642";
    set $hermes_dashboard "hermes:9119";
    set $chatlite_inbox   "inbox:8080";

    # 静态资源（带 hash，可长缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # ★★ 静态资源"缺文件"必须是**真 404**，不能回落成 200 的入口 HTML（2026-09-15 加固）：
    #    `location /` 的 `try_files $uri $uri/ /index.html` 对不存在的 /favicon.svg **也**返回
    #    200 + text/html（内容是入口 HTML）。后果是"文件压根没打进镜像"这种错在浏览器和 curl 里
    #    都看不见 —— 实测就栽过：favicon 换了没生效，curl 一看 200，还被判成浏览器缓存问题，
    #    真凶是 Dockerfile 漏了 COPY public/。
    #    这里按后缀兜底成 =404，把**静默的错**变成**响亮的错**。
    #    优先级：正则 location 优先于 `location /` 的前缀匹配；`= /index.html` 精确匹配优先级最高，
    #    因此入口 HTML 不受影响。`/api`、`/v1` 那条正则写在文件后面，且这些后缀不会出现在 API
    #    路径上（/api/model-info 无后缀），两者不会抢。
    #    ⚠️ 正则**锚在根层**（`^/[^/]+\.…`）是有意的：不锚的话 `/assets/x.woff2`、`/assets/x.svg`
    #    这类 vite 产物会被这条正则抢走，从而**绕过 /assets/ 那条一年 immutable 缓存头**（缓存行为
    #    悄悄退化）。锚定后：根层的图标/清单文件缺了就 404；`/assets/` 下的文件仍旧走上面那条
    #    （它本来就已经是 `try_files $uri =404`，不缺 404 语义，两者互不干扰）。
    location ~* ^/[^/]+\.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|map|webmanifest)$ {
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # ★★ 入口 HTML 一律不缓存（否则手机上会一直吃旧版本，实测踩过）：
    #   1) 没有 Cache-Control 时，浏览器按 Last-Modified 做"启发式缓存"，小米浏览器这类自带
    #      webview 缓存的更激进 —— 实测现象：服务端镜像已经是新产物（旧 bundle 404），
    #      手机上刷好几次、甚至杀进程重开，页面引用的还是旧的 index.html。
    #   2) 带 hash 的 /assets/ 长缓存本身没问题（上面那段），**前提是入口 HTML 每次都是新的** ——
    #      新 HTML 会引用新 hash 文件名，浏览器自然会去取新文件。入口 HTML 被缓存 = 整条链断掉。
    #   3) no-store + 关掉 ETag/If-Modified-Since：不给缓存任何"用旧副本"的机会（这份 HTML 1.5KB）。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        etag off;
        if_modified_since off;
    }

    # 单页应用：未知路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hermes API 反代（/api /v1 /health）
    # ★ 鉴权头在这里注入 —— 前端产物里永远没有 key
    location ~ ^/(api|v1)(/|$)|^/health$ {
        # 变量形式 ⇒ 每次建连前重新解析 hermes 的当前 IP（见文件头的 resolver 说明）
        proxy_pass http://$hermes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer ${HERMES_API_SERVER_KEY}";
        proxy_set_header Connection "";

        # ★★ 必须清掉 Origin（实测踩坑）：
        #    Hermes API Server 的 CORS 中间件对【任何带 Origin 头的请求】直接返回 403 空响应
        #    （防 CSRF 设计，cors: false 时生效）。浏览器所有 POST 都会带 Origin，curl 不会，
        #    所以这个坑在命令行测试里 100% 看不见，只在真机浏览器上炸。
        #    nginx 语义：把某请求头设成空字符串 = 不向后端传递该头。
        proxy_set_header Origin "";

        # ★★ SSE 关键三件套：忘了 proxy_buffering off，流式会退化成"等全部返回才显示"
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # agent 单轮可能跑很久（工具链、长任务）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ★ 消息中心（inbox）反代 —— 独立的 /inbox 前缀，**不要**写成 /api/inbox：
    #    /api 那条正则在上，会把 /api/inbox/... 抢去 hermes:8642（那边没这个路由 → 404）。
    #    令牌注入姿势与 /api 一致：复用同一个 ${HERMES_API_SERVER_KEY} 当 X-Inbox-Token，
    #    所以前端产物里依旧没有任何密钥；Origin 同样要清（后端同款 CSRF 习惯，浏览器请求都带 Origin）。
    location ~ ^/inbox(/|$) {
        proxy_pass http://$chatlite_inbox;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Inbox-Token "${HERMES_API_SERVER_KEY}";
        proxy_set_header Origin "";
        proxy_set_header Connection "";

        # 都是小 JSON，拿不到就快速失败（前端按退避重试，不该拖着界面）
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # ★★ 模型 + 上下文窗口上限（输入框上方那行的分母）
    #    这个接口在 **dashboard 后端（hermes:9119）**，不在 API server（hermes:8642）上 ——
    #    所以必须单独转发，不能并到上面那条 /api 的 location 里（那条会打到 8642 变成 404）。
    #    路径用精确匹配 `= /api/model-info`，因此不会跟上面 `^/(api|v1)(/|$)` 的正则抢；
    #    前端请求的是 `/api/model-info`（不是 `/api/model/info`），避免和 API server 的
    #    `/api/...` 命名空间混淆（也省得以后那边真加了同名路由撞车）。
    #    只读 GET、不带任何凭据；清掉 Origin 以防后端有同类 CSRF 防护。
    location = /api/model-info {
        proxy_pass http://$hermes_dashboard/api/model/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin "";
        proxy_set_header Connection "";

        # 拿不到时快速降级（界面只是不显示分母，不该拖着）
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
