# Hermes Chat Lite —— nginx 配置（模板）
#
# 由 nginx 官方镜像的入口脚本做 envsubst 后写入 /etc/nginx/conf.d/default.conf。
# ⚠️ 它只替换【环境变量里存在】的名字（HERMES_API_SERVER_KEY），
#    nginx 自己的 $host / $uri / $remote_addr 不在环境里，不会被吃掉。
#    千万不要手工 `envsubst < nginx.conf`（会把 $host 也替换成空）。

upstream hermes_api {
    server hermes:8642;
    keepalive 16;
}

# dashboard 后端：上下文窗口上限（/api/model/info）在这里，不在 API server 上
upstream hermes_dashboard {
    server hermes:9119;
    keepalive 4;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（带 hash，可长缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # ★★ 入口 HTML 一律不缓存（否则手机上会一直吃旧版本，实测踩过）：
    #   1) 没有 Cache-Control 时，浏览器按 Last-Modified 做"启发式缓存"，小米浏览器这类自带
    #      webview 缓存的更激进 —— 实测现象：服务端镜像已经是新产物（旧 bundle 404），
    #      手机上刷好几次、甚至杀进程重开，页面引用的还是旧的 index.html。
    #   2) 带 hash 的 /assets/ 长缓存本身没问题（上面那段），**前提是入口 HTML 每次都是新的** ——
    #      新 HTML 会引用新 hash 文件名，浏览器自然会去取新文件。入口 HTML 被缓存 = 整条链断掉。
    #   3) no-store + 关掉 ETag/If-Modified-Since：不给缓存任何"用旧副本"的机会（这份 HTML 1.5KB）。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        etag off;
        if_modified_since off;
    }

    # 单页应用：未知路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hermes API 反代（/api /v1 /health）
    # ★ 鉴权头在这里注入 —— 前端产物里永远没有 key
    location ~ ^/(api|v1)(/|$)|^/health$ {
        proxy_pass http://hermes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer ${HERMES_API_SERVER_KEY}";
        proxy_set_header Connection "";

        # ★★ 必须清掉 Origin（实测踩坑）：
        #    Hermes API Server 的 CORS 中间件对【任何带 Origin 头的请求】直接返回 403 空响应
        #    （防 CSRF 设计，cors: false 时生效）。浏览器所有 POST 都会带 Origin，curl 不会，
        #    所以这个坑在命令行测试里 100% 看不见，只在真机浏览器上炸。
        #    nginx 语义：把某请求头设成空字符串 = 不向后端传递该头。
        proxy_set_header Origin "";

        # ★★ SSE 关键三件套：忘了 proxy_buffering off，流式会退化成"等全部返回才显示"
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # agent 单轮可能跑很久（工具链、长任务）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ★★ 模型 + 上下文窗口上限（输入框上方那行的分母）
    #    这个接口在 **dashboard 后端（hermes:9119）**，不在 API server（hermes:8642）上 ——
    #    所以必须单独转发，不能并到上面那条 /api 的 location 里（那条会打到 8642 变成 404）。
    #    路径用精确匹配 `= /api/model-info`，因此不会跟上面 `^/(api|v1)(/|$)` 的正则抢；
    #    前端请求的是 `/api/model-info`（不是 `/api/model/info`），避免和 API server 的
    #    `/api/...` 命名空间混淆（也省得以后那边真加了同名路由撞车）。
    #    只读 GET、不带任何凭据；清掉 Origin 以防后端有同类 CSRF 防护。
    location = /api/model-info {
        proxy_pass http://hermes_dashboard/api/model/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin "";
        proxy_set_header Connection "";

        # 拿不到时快速降级（界面只是不显示分母，不该拖着）
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
