# Hermes Chat Lite —— nginx 配置（模板）
#
# 由 nginx 官方镜像的入口脚本做 envsubst 后写入 /etc/nginx/conf.d/default.conf。
# ⚠️ 它只替换【环境变量里存在】的名字（HERMES_API_SERVER_KEY），
#    nginx 自己的 $host / $uri / $remote_addr 不在环境里，不会被吃掉。
#    千万不要手工 `envsubst < nginx.conf`（会把 $host 也替换成空）。

upstream hermes_api {
    server hermes:8642;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（带 hash，可长缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # 单页应用：未知路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hermes API 反代（/api /v1 /health）
    # ★ 鉴权头在这里注入 —— 前端产物里永远没有 key
    location ~ ^/(api|v1)(/|$)|^/health$ {
        proxy_pass http://hermes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer ${HERMES_API_SERVER_KEY}";
        proxy_set_header Connection "";

        # ★★ SSE 关键三件套：忘了 proxy_buffering off，流式会退化成"等全部返回才显示"
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # agent 单轮可能跑很久（工具链、长任务）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
